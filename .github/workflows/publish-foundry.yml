name: Publish to Foundry VTT

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choisir un test ou la publication réelle"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - publish

      confirmation:
        description: "Pour publier, saisir exactement : PUBLISH 1.1.1"
        required: false
        type: string

permissions:
  contents: read

jobs:
  foundry-release:
    name: Foundry package release
    runs-on: ubuntu-latest

    env:
      PACKAGE_ID: evil-tencandles-roll
      PACKAGE_VERSION: 1.1.1

      MANIFEST_URL: https://github.com/ctotone/evil-tencandles-roll/releases/download/1.1.1/module.json
      NOTES_URL: https://github.com/ctotone/evil-tencandles-roll/releases/tag/1.1.1

      FOUNDRY_MINIMUM: "14"
      FOUNDRY_VERIFIED: "14"

      MODE: ${{ inputs.mode }}
      CONFIRMATION: ${{ inputs.confirmation }}
      FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}

    steps:
      - name: Vérifier les paramètres
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${FOUNDRY_RELEASE_TOKEN:-}" ]]; then
            echo "::error::Le secret FOUNDRY_RELEASE_TOKEN est absent ou vide."
            exit 1
          fi

          if [[ "$MODE" == "publish" ]] &&
             [[ "$CONFIRMATION" != "PUBLISH 1.1.1" ]]; then
            echo "::error::Publication annulée : la confirmation est incorrecte."
            echo 'Saisir exactement : PUBLISH 1.1.1'
            exit 1
          fi

          echo "Mode sélectionné : $MODE"
          echo "Module : $PACKAGE_ID"
          echo "Version : $PACKAGE_VERSION"

      - name: Préparer la requête Foundry
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$MODE" == "dry-run" ]]; then
            jq -n \
              --arg id "$PACKAGE_ID" \
              --arg version "$PACKAGE_VERSION" \
              --arg manifest "$MANIFEST_URL" \
              --arg notes "$NOTES_URL" \
              --arg minimum "$FOUNDRY_MINIMUM" \
              --arg verified "$FOUNDRY_VERIFIED" \
              '{
                id: $id,
                "dry-run": true,
                release: {
                  version: $version,
                  manifest: $manifest,
                  notes: $notes,
                  compatibility: {
                    minimum: $minimum,
                    verified: $verified
                  }
                }
              }' > payload.json
          else
            jq -n \
              --arg id "$PACKAGE_ID" \
              --arg version "$PACKAGE_VERSION" \
              --arg manifest "$MANIFEST_URL" \
              --arg notes "$NOTES_URL" \
              --arg minimum "$FOUNDRY_MINIMUM" \
              --arg verified "$FOUNDRY_VERIFIED" \
              '{
                id: $id,
                release: {
                  version: $version,
                  manifest: $manifest,
                  notes: $notes,
                  compatibility: {
                    minimum: $minimum,
                    verified: $verified
                  }
                }
              }' > payload.json
          fi

          echo "Requête préparée :"
          jq . payload.json

      - name: Envoyer la requête à Foundry
        shell: bash
        run: |
          set -euo pipefail

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              --location \
              --output response.json \
              --write-out "%{http_code}" \
              --request POST \
              --header "Content-Type: application/json" \
              --header "Authorization: ${FOUNDRY_RELEASE_TOKEN}" \
              --data-binary @payload.json \
              "https://foundryvtt.com/_api/packages/release_version/"
          )"

          echo "Code HTTP reçu : $HTTP_CODE"
          echo "Réponse de Foundry :"

          if jq empty response.json >/dev/null 2>&1; then
            jq . response.json
          else
            cat response.json
          fi

          if [[ "$HTTP_CODE" -lt 200 || "$HTTP_CODE" -ge 300 ]]; then
            echo "::error::La requête Foundry a échoué avec le code HTTP $HTTP_CODE."
            exit 1
          fi

          STATUS="$(jq -r '.status // empty' response.json 2>/dev/null || true)"

          if [[ "$STATUS" != "success" ]]; then
            echo "::error::Foundry n’a pas confirmé le succès de la requête."
            exit 1
          fi

          if [[ "$MODE" == "dry-run" ]]; then
            echo "Dry-run Foundry validé avec succès."
          else
            echo "Version $PACKAGE_VERSION publiée avec succès sur Foundry."
          fi
